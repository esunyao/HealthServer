[project]
name = "agentdevelop"
version = "0.1.0"
description = "HealthMind meal-analysis Agent prototype (manual use; not wired into service orchestration)"
readme = "README.md"
authors = [
    { name = "Esuny", email = "esun.yao@hotmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.17",
    "langchain==1.4.2",
    "langchain-core>=1.6.4",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langchain-openai>=1.6.3",
    "langgraph==1.2.12",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.2.3",
]

[project.scripts]
agentdevelop = "agentdevelop.main:main"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
]
