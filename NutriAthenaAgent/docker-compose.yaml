services:
  nutriathena-agent:
    build:
      context: "https://github.com/esunyao/HealthServer.git#${NUTRIATHENA_GIT_REF:-master}:NutriAthenaAgent"
      dockerfile: Dockerfile
    image: nutriathena-agent:local
    pull_policy: build
    restart: unless-stopped
    env_file:
      - path: ${NUTRIATHENA_ENV_FILE:-.env}
        required: false
    environment:
      NUTRIATHENA_HOST: 0.0.0.0
      NUTRIATHENA_PORT: "8101"
    # 可选：只读挂载本地 config.yaml（优先级低于 env_file 与 environment）。
    # 确认宿主机文件存在后再取消注释，否则 Docker 会把它创建成目录。
    # volumes:
    #   - ./config.yaml:/workspace/NutriAthenaAgent/config.yaml:ro
    ports:
      - "${NUTRIATHENA_PUBLISHED_PORT:-8101}:8101"
    networks:
      - healthserver
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  healthserver:
    external: true
    name: ${HEALTHSERVER_DOCKER_NETWORK:?Set HEALTHSERVER_DOCKER_NETWORK to an existing Docker network}
