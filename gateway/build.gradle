plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.spring'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

dependencies {
    // Spring Cloud Gateway (WebFlux) — 路由、过滤器、负载均衡（响应式）
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    // JWT — 验证 Access Token（只做解析验证，不签发）
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Redis — 检查 Token 黑名单（响应式版本，与 WebFlux 架构一致）
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'

    // Nacos 服务注册与发现 — Spring Cloud Alibaba 原生支持
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'

    // Spring Boot Actuator — 提供 /actuator/health 等运维监控端点
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Spring Cloud LoadBalancer — 提供客户端负载均衡能力
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    // 测试依赖
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}


