<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HealthMindControl</title><link rel="stylesheet" href="/static/app.css">
</head>
<body data-csrf="{{ csrf_token }}">
<aside><h1>HealthMind<span>Control</span></h1><p class="muted">本地运维控制台</p>
  <nav>
    <button data-view="dashboard" class="active">总览</button><button data-view="tasks">任务</button>
    <button data-view="trace">链路</button><button data-view="kafka">Kafka</button>
    <button data-view="releases">Dify 版本</button><button data-view="repair">修复</button>
  </nav><div class="guard">仅监听<br><b>127.0.0.1:8765</b></div></aside>
<main>
  <header><div><h2 id="title">运行总览</h2><p id="subtitle">每 {{ refresh }} 秒动态刷新</p></div><div id="clock"></div></header>
  <section id="dashboard" class="view active"><div id="health" class="health-grid"></div><div class="two"><article><h3>AI 任务</h3><div id="task-stats" class="stats"></div></article><article><h3>生产版本</h3><pre id="production">载入中…</pre></article></div><article><h3>滞留与失败</h3><div id="backlogs"></div></article></section>
  <section id="tasks" class="view"><article><div class="toolbar"><select id="task-status"><option value="">所有状态</option><option>queued</option><option>running</option><option>succeeded</option><option>failed</option><option>cancelled</option></select><button id="load-tasks">刷新</button></div><div id="task-table"></div></article></section>
  <section id="trace" class="view"><article><h3>端到端链路查询</h3><div class="toolbar"><input id="trace-id" placeholder="trace / event / task / attempt / meal / capture ID"><button id="find-trace">查询</button></div><div id="trace-results"></div></article></section>
  <section id="kafka" class="view"><div class="two"><article><h3>Topic 与分区</h3><div id="topics"></div></article><article><h3>消费组</h3><div id="groups"></div></article></div><article><h3>无提交消息查看器</h3><div class="toolbar"><select id="message-topic"></select><input id="message-partition" type="number" value="0" min="0"><select id="message-start"><option>latest</option><option>earliest</option></select><input id="message-filter" placeholder="key / event / trace"><button id="load-messages">读取</button></div><div id="messages"></div></article><article class="danger"><h3>高级：生产消息</h3><p class="muted">必须先预览。业务事件结构不完整时需显式强制。</p><div class="form"><input id="produce-topic" placeholder="topic"><input id="produce-key" placeholder="key（可空）"><textarea id="produce-payload" rows="8">{}</textarea><input id="produce-reason" placeholder="操作原因"><button id="preview-produce">预览</button></div><div id="produce-preview"></div></article></section>
  <section id="releases" class="view"><article><div class="toolbar"><button id="discover-dify">用 difyctl 探测</button><button id="load-releases">刷新版本</button></div><div id="dify-result"></div><div id="release-table"></div></article><article><h3>登记 candidate</h3><div class="form compact"><input id="rel-version" placeholder="HealthMind release version"><input id="rel-workspace" placeholder="workspace ID"><input id="rel-app" placeholder="app ID"><input id="rel-workflow" placeholder="published workflow ID"><input id="rel-workflow-version" placeholder="workflow version"><textarea id="rel-input" rows="5" placeholder="input schema JSON"></textarea><textarea id="rel-output" rows="5" placeholder="output schema JSON"></textarea><input id="rel-reason" placeholder="操作原因"><button id="preview-release">预览登记</button></div><div id="release-preview"></div></article></section>
  <section id="repair" class="view"><article class="danger"><h3>受控修复</h3><div class="form compact"><select id="repair-operation"><option value="reset_outbox">重置 outbox</option><option value="recover_attempt">恢复超时 attempt</option><option value="cancel_task">取消 queued task</option></select><select id="repair-schema"><option>healthmind</option><option>nutri</option></select><input id="repair-id" placeholder="event / attempt / task ID"><input id="repair-reason" placeholder="操作原因"><button id="preview-repair">预览修复</button></div><div id="repair-preview"></div></article><article><h3>克隆失败任务</h3><div class="form compact"><input id="retry-task" placeholder="failed task ID"><input id="retry-release" placeholder="release ID（留空使用 production）"><input id="retry-reason" placeholder="操作原因"><button id="preview-retry">预览重试</button></div><div id="retry-preview"></div></article></section>
</main><div id="toast"></div><script src="/static/app.js"></script></body></html>
