[project]
name = "healthmind-control"
version = "0.4.0"
description = "Local operations console for HealthMind, NutriMemo, Kafka and Dify"
requires-python = ">=3.12,<3.13"
dependencies = [
  # 2.15.0 Windows wheel omits the documented confluent_kafka.admin package.
  # Keep the latest known-good release until the upstream wheel is corrected.
  "confluent-kafka>=2.14.2,<2.15",
  "fastapi>=0.115",
  "httpx>=0.28",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "pglast>=7.2",
  "portalocker>=3.1",
  "psycopg[binary,pool]>=3.2",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25", "httpx>=0.28"]

[project.scripts]
healthmind-control = "healthmind_control.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthmind_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
