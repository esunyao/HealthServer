# ============================================================================
# Orion 公共配置
# ----------------------------------------------------------------------------
# 本文件可安全提交至公开仓库：不含任何真实密钥 / 凭据 / 机器专属信息。
# 所有敏感项通过环境变量注入，未设置时为空字符串或占位符 —— 缺少凭据时服务
# 会拒绝工作，这正是期望行为，防止公开模板被"开箱即用"地误部署。
#
# 环境变量速查表（可在 .env / 部署平台 / 运行配置中设置）：
#   SERVER_PORT       网关监听端口
#   DB_URL            PostgreSQL JDBC URL
#   DB_USERNAME       数据库用户名
#   DB_PASSWORD       数据库密码
#   NACOS_SERVER_ADDR Nacos 地址
#   NACOS_USERNAME    Nacos 用户名
#   NACOS_PASSWORD    Nacos 密码
#   REDIS_HOST        Redis 地址
#   REDIS_PORT        Redis 端口
#   REDIS_PASSWORD    Redis 密码
#   JWT_SECRET        JWT 共享密钥
#   OSS_ENDPOINT      S3 兼容存储端点
#   OSS_ADDR          预签名地址
#   OSS_ACCESS_KEY    存储访问密钥
#   OSS_SECRET_KEY    存储私密密钥
#   OSS_BUCKET        存储桶名称
#
# 本地调试：在模块目录放置 .env（模板见 .env.example，已被 gitignore），
# spring-dotenv 自动注入，无需设置环境变量或 profile。
# ============================================================================

server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: Orion

  # Spring Boot 配置导入机制；optional: 前缀防止 Nacos 不可用时启动失败
  config:
    import:
      - "optional:nacos:Orion_Application.yaml?group=ORION_GROUP&refreshEnabled=true"

  # ----------------------------------------------------------
  # 数据源配置 — PostgreSQL
  # ----------------------------------------------------------
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20      # 连接池最大连接数
      minimum-idle: 5            # 最小空闲连接数
      idle-timeout: 300000       # 空闲连接超时时间（5分钟）
      max-lifetime: 1200000      # 连接最大存活时间（20分钟）
      connection-timeout: 20000  # 获取连接超时时间（20秒）

  flyway:
    enabled: false   # 由 FlywayConfig.kt 手动管理，解决 "User" schema 大小写问题

  # ----------------------------------------------------------
  # Redis 配置
  # ----------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # ----------------------------------------------------------
  # Nacos 服务发现配置（Spring Cloud Alibaba 原生）
  # ----------------------------------------------------------
  cloud:
    nacos:
      serverAddr: ${NACOS_SERVER_ADDR:}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        enabled: true
        group: 'HEALTH_GROUP'

# ----------------------------------------------------------
# JWT 配置（密钥与 Gateway 共享，通过环境变量注入）
# ----------------------------------------------------------
jwt:
  # 密钥（至少 256 位 / 32 字节），生产环境应从环境变量或 Nacos 注入
  secret: ${JWT_SECRET:}
  # Access Token 有效期：15 分钟（毫秒）
  access-token-expiration: 900000
  # Refresh Token 有效期：7 天（毫秒）
  refresh-token-expiration: 604800000

# ----------------------------------------------------------
# OSS 对象存储配置（S3 兼容协议）
# ----------------------------------------------------------
oss:
  endpoint: ${OSS_ENDPOINT:}
  presignedAddr: ${OSS_ADDR:}
  access-key: ${OSS_ACCESS_KEY:}
  secret-key: ${OSS_SECRET_KEY:}
  bucket: ${OSS_BUCKET:}
  region: us-east-1
  presigned-expiration: 5m
  max-file-size: 5242880  # 5MB
  allowed-content-types:
    - image/jpeg
    - image/png
    - image/webp
    - image/gif
  # cdn-domain: https://cdn.example.com  # 可选
  cleanup:
    fixed-delay: 60000
    batch-size: 100
    orphan-scan-batch-size: 1000
    orphan-protection-hours: 24
    max-attempts: 8
    processing-timeout-minutes: 30
    orphan-scan-cron: "0 30 3 * * *"

# ----------------------------------------------------------
# Actuator 监控端点配置
# ----------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ----------------------------------------------------------
# 日志配置
# ----------------------------------------------------------
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-NO_TRACE}] %-5level %logger{36} - %msg%n"
  level:
    cn.esuny.orion: INFO
    cn.esuny.orion.mapper: INFO
