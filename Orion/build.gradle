plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencies {
    // Spring Cloud Gateway (WebFlux 版本) — 网关核心，提供路由转发能力（响应式）
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Spring Boot 4.x 新拆分的模块，包含 WebServerInitializedEvent
    // Spring Cloud Commons 依赖此类进行服务注册，但不会自动传递引入
//    implementation 'org.springframework.boot:spring-boot-web-server'

    // Nacos 服务注册与发现 — Spring Cloud Alibaba 原生支持
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'

    // Spring Boot Actuator — 提供 /actuator/health 等运维监控端点
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 测试依赖
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

