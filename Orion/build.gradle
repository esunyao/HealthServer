plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

dependencies {
    // Spring Boot Web (Servlet) — 传统 MVC，用于处理用户请求
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // MyBatis-Plus — ORM 持久化层，Spring Boot 4 专用 starter
    implementation 'com.baomidou:mybatis-plus-spring-boot4-starter:3.5.17'
    // MyBatis-Plus 分页插件（需要 jsqlparser）
    implementation 'com.baomidou:mybatis-plus-jsqlparser:3.5.17'

    // PostgreSQL JDBC 驱动（PgStringArrayTypeHandler 编译期需要 PGobject）
    implementation 'org.postgresql:postgresql'

    // Redis — 缓存 / 会话 / 分布式锁
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Nacos 服务注册与发现 — Spring Cloud Alibaba 原生支持
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'

    // Spring Boot Actuator — 提供 /actuator/health 等运维监控端点
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 验证 — Bean Validation，配合实体校验
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // JWT — 令牌生成与解析
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Spring Security Crypto — 仅使用 BCrypt 密码加密，不引入完整安全过滤链
    implementation 'org.springframework.security:spring-security-crypto'

    // Jackson JSR310 — 支持 Java 8 时间类型序列化（Redis 配置需要）
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // 测试依赖
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

