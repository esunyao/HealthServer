        targetBodyFatPercentage: { type: number, format: double, nullable: true, description: 目标体脂率 }
        priority: { type: integer, format: int32, description: 优先级 }
        status: { type: string, enum: [planned, active, achieved, cancelled], description: 目标状态 }
