      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/UserBodyMeasurement' } } }
    HealthGoalResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties: { data: { $ref: '#/components/schemas/UserHealthGoal' } }
    HealthGoalListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties: { data: { type: array, items: { $ref: '#/components/schemas/UserHealthGoal' } } }
    AllergyResponse:
