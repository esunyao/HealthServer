    UserProfileUpdateRequest:
      type: object
      description: 用户基础健康档案更新请求，所有字段可选。
      properties:
        birthDate: { type: string, format: date, description: 出生日期；对应年龄必须在 10 至 120 岁之间 }
        gender: { type: string, enum: [male, female, other, unknown], description: 性别 }
        heightCm: { type: number, format: double, minimum: 50, maximum: 300, description: 身高，单位厘米 }
        activityLevel: { type: string, enum: [sedentary, light, moderate, active, very_active], description: 活动水平 }
        dailyWaterTargetMl: { type: integer, format: int32, minimum: 0, maximum: 10000, description: 每日饮水目标，单位毫升 }
    BodyMeasurementRequest:
      type: object
      description: 身体测量请求；至少填写一个测量指标。
      properties:
        measuredAt: { type: string, format: date-time, description: 测量时间，默认当前时间 }
        heightCm: { type: number, format: double, minimum: 50, maximum: 300, description: 身高，单位厘米 }
        weightKg: { type: number, format: double, minimum: 10, maximum: 500, description: 体重，单位千克 }
        bodyFatPercentage: { type: number, format: double, minimum: 0, maximum: 100, description: 体脂率，百分比 }
        waistCm: { type: number, format: double, minimum: 20, maximum: 300, description: 腰围，单位厘米 }
        systolicBp: { type: integer, format: int32, minimum: 40, maximum: 300, description: 收缩压，单位 mmHg }
        diastolicBp: { type: integer, format: int32, minimum: 20, maximum: 200, description: 舒张压，单位 mmHg }
        restingHeartRate: { type: integer, format: int32, minimum: 20, maximum: 250, description: 静息心率，单位 bpm }
        source: { type: string, enum: [manual, device, import, clinical], default: manual, description: 数据来源 }
        sourceReference: { type: string, maxLength: 255, description: 外部设备或来源引用 }
        notes: { type: string, maxLength: 500, description: 备注 }
    HealthGoalRequest:
      type: object
      required: [goalType]
      properties:
        goalType: { type: string, enum: [weight_loss, muscle_gain, maintain, health_improve], description: 目标类型 }
        targetWeightKg: { type: number, format: double, minimum: 10, maximum: 500, description: 目标体重，单位千克 }
        targetBodyFatPercentage: { type: number, format: double, minimum: 0, maximum: 100, description: 目标体脂率 }
        priority: { type: integer, format: int32, minimum: 1, maximum: 10, default: 1, description: 优先级 }
        status: { type: string, enum: [planned, active, achieved, cancelled], default: active, description: 目标状态 }
        startedOn: { type: string, format: date, description: 开始日期 }
        targetDate: { type: string, format: date, description: 目标日期，不早于 startedOn }
        notes: { type: string, maxLength: 500, description: 备注 }
    AllergyRequest:
      type: object
      required: [allergenCode, allergenName]
      properties:
        allergenCode: { type: string, maxLength: 64, description: 过敏原编码 }
        allergenName: { type: string, maxLength: 100, description: 过敏原名称 }
        severity: { type: string, enum: [mild, moderate, severe, life_threatening], description: 严重程度 }
        reactionDescription: { type: string, maxLength: 500, description: 反应描述 }
        diagnosisStatus: { type: string, enum: [self_reported, suspected, confirmed], default: self_reported, description: 诊断状态 }
        recordedOn: { type: string, format: date, description: 记录日期 }
        active: { type: boolean, default: true, description: 是否仍然有效 }
        notes: { type: string, maxLength: 500, description: 备注 }
    MedicalConditionRequest:
      type: object
      required: [conditionCode, conditionName]
      properties:
        conditionCode: { type: string, maxLength: 64, description: 疾病编码 }
        conditionName: { type: string, maxLength: 150, description: 疾病名称 }
        status: { type: string, enum: [active, remission, resolved], default: active, description: 疾病状态 }
        diagnosedOn: { type: string, format: date, description: 诊断日期 }
        resolvedOn: { type: string, format: date, description: 解决日期，不早于 diagnosedOn }
        source: { type: string, enum: [self_reported, clinical, imported], default: self_reported, description: 数据来源 }
        notes: { type: string, description: 备注 }
    DietaryRestrictionRequest:
      type: object
      required: [restrictionCode, restrictionName, category]
      properties:
        restrictionCode: { type: string, maxLength: 64, description: 饮食限制编码 }
        restrictionName: { type: string, maxLength: 100, description: 饮食限制名称 }
        category: { type: string, enum: [medical, religious, lifestyle, preference], description: 限制类别 }
        source: { type: string, enum: [self_reported, clinician, system], default: self_reported, description: 数据来源 }
        active: { type: boolean, default: true, description: 是否有效 }
        startsOn: { type: string, format: date, description: 生效日期 }
        endsOn: { type: string, format: date, description: 结束日期，不早于 startsOn }
        notes: { type: string, maxLength: 500, description: 备注 }
    CuisinePreferenceRequest:
      type: object
      required: [cuisineCode, cuisineName]
      properties:
        cuisineCode: { type: string, maxLength: 64, description: 菜系编码 }
        cuisineName: { type: string, maxLength: 100, description: 菜系名称 }
        preferenceScore: { type: integer, format: int32, minimum: -2, maximum: 2, default: 0, description: 偏好分数，-2 至 2 }
        notes: { type: string, maxLength: 500, description: 备注 }
    ReplaceCuisinePreferencesRequest:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          minItems: 1
          description: 完整菜系偏好列表，编码不能重复
          items: { $ref: '#/components/schemas/CuisinePreferenceRequest' }
    ClinicalObservationRequest:
      type: object
      required: [observationCode, observationName]
      description: valueNumeric 与 valueText 必须且只能提供一个。
      properties:
        observationCode: { type: string, maxLength: 64, description: 观察项编码 }
        observationName: { type: string, maxLength: 150, description: 观察项名称 }
        valueNumeric: { type: number, format: double, description: 数值结果，与 valueText 二选一 }
        valueText: { type: string, maxLength: 500, description: 文本结果，与 valueNumeric 二选一 }
        unit: { type: string, maxLength: 32, description: 数值单位 }
        referenceLow: { type: number, format: double, description: 参考下限 }
        referenceHigh: { type: number, format: double, description: 参考上限，不小于 referenceLow }
        interpretation: { type: string, enum: [low, normal, high, critical, unknown], default: unknown, description: 解释结果 }
        observedAt: { type: string, format: date-time, description: 观察时间，默认当前时间 }
        source: { type: string, enum: [self_reported, clinical, device, imported], default: self_reported, description: 数据来源 }
        reportObjectKey: { type: string, maxLength: 1024, description: 报告对象存储键 }
        metadata: { type: string, default: '{}', description: JSON 对象字符串 }
    UserConsentRequest:
      type: object
      required: [consentType, policyVersion]
      properties:
        consentType: { type: string, maxLength: 64, description: 同意类型 }
        policyVersion: { type: string, maxLength: 32, description: 政策版本 }
        granted: { type: boolean, default: true, description: 是否同意 }
        source: { type: string, enum: [mobile, web, admin, imported], default: mobile, description: 记录来源 }
    AvatarPresignRequest:
      type: object
      required: [fileName, contentType]
      properties:
        fileName: { type: string, minLength: 1, description: 原始文件名 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif], description: 文件 MIME 类型 }

    UserVO:
      type: object
      required: [userId, username, emailVerified, displayName, businessStatus, locale, timezone, createdAt, updatedAt]
      properties:
        userId: { type: string, format: uuid, description: Authentik sub UUID }
