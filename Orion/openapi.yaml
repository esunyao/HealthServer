  schemas:
    ApiResponseBase:
      type: object
      required: [code, message, timestamp]
      properties:
        code: { type: integer, format: int32, description: HTTP 风格业务状态码, example: 200 }
        message: { type: string, description: 结果说明, example: Success }
        traceId: { type: string, nullable: true, description: 请求链路 ID }
        timestamp: { type: integer, format: int64, description: 服务端生成的毫秒时间戳, example: 1723190400000 }
    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { nullable: true, description: 失败时固定为空 }
    EmptyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data: { nullable: true, description: 成功但没有业务数据 }
    UserResponse:
