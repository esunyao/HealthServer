openapi: 3.0.3
info:
  title: Orion 用户服务 API
  version: 1.0.0
  description: |
    Orion 用户服务。认证由 Authentik OIDC 和 Gateway 负责，Orion 不提供注册、登录、刷新 Token、登出或修改密码接口。

    客户端只需向 Gateway 发送 Bearer Access Token。Gateway 验签后向 Orion 注入可信身份信息，Orion 使用 Authentik `sub` UUID 自动建档。
    所有接口和字段均带有中文说明，导入 Apifox 后可直接生成接口目录、请求模型和响应模型。
servers:
  - url: http://localhost:8091
    description: 本地 Gateway
tags:
  - name: 当前用户
    description: 当前登录用户的身份缓存与业务账户操作
  - name: 基础档案
    description: 用户基础健康档案
  - name: 身体测量
    description: 身高、体重、体脂、血压等历史测量
  - name: 健康目标
    description: 用户健康目标
  - name: 过敏记录
    description: 用户过敏原记录
  - name: 疾病记录
    description: 用户医疗状况记录
  - name: 饮食限制
    description: 用户饮食限制记录
  - name: 菜系偏好
    description: 用户菜系偏好
  - name: 临床观察
    description: 只允许追加的临床观察记录
  - name: 同意记录
    description: 只允许追加的隐私或业务同意记录
  - name: 头像
    description: 头像预签名直传与确认
security:
  - bearerAuth: []
paths:
  /v1/users/self:
    get:
      tags: [当前用户]
      summary: 获取当前用户
      description: 首次认证访问时自动创建用户和空档案；返回的 userId 等于 Authentik OIDC sub。
      operationId: getCurrentUser
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [当前用户]
      summary: 注销当前业务账户
      description: 只执行 Orion 业务软注销，不删除 Authentik 身份；注销后不能通过身份同步自动恢复。
      operationId: deactivateCurrentUser
      responses:
        '200': { $ref: '#/components/responses/EmptyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/profile:
    get:
      tags: [基础档案]
      summary: 获取当前用户基础档案
      description: 返回当前用户的健康档案；用户首次认证访问时由服务端自动创建空档案。
      operationId: getCurrentUserProfile
      responses:
        '200': { $ref: '#/components/responses/ProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [基础档案]
      summary: 更新当前用户基础档案
      description: 所有字段均可选；出生日期对应年龄必须在 10 至 120 岁之间，完整填写出生日期、性别、身高和活动水平后标记档案完成。
      operationId: updateCurrentUserProfile
      requestBody: { $ref: '#/components/requestBodies/ProfileUpdate' }
      responses:
        '200': { $ref: '#/components/responses/ProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/body-measurements:
    get:
      tags: [身体测量]
      summary: 查询身体测量记录
      description: 按当前用户查询身体测量历史，结果只包含当前用户自己的记录。
      operationId: listBodyMeasurements
      responses:
        '200': { $ref: '#/components/responses/BodyMeasurementListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [身体测量]
      summary: 新增身体测量记录
      description: 至少填写一个测量指标；测量时间不能晚于当前时间 5 分钟。
      operationId: createBodyMeasurement
      requestBody: { $ref: '#/components/requestBodies/BodyMeasurement' }
      responses:
        '200': { $ref: '#/components/responses/BodyMeasurementResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/body-measurements/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    patch:
      tags: [身体测量]
      summary: 修改身体测量记录
      description: 只能修改当前用户自己的记录；请求至少保留一个测量指标。
      operationId: updateBodyMeasurement
      requestBody: { $ref: '#/components/requestBodies/BodyMeasurement' }
      responses:
        '200': { $ref: '#/components/responses/BodyMeasurementResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [身体测量]
      summary: 删除身体测量记录
      description: 删除当前用户指定的身体测量记录；不存在或不属于当前用户时返回 404。
      operationId: deleteBodyMeasurement
      responses:
        '200': { $ref: '#/components/responses/EmptyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/health-goals:
    get:
      tags: [健康目标]
      summary: 查询健康目标
      description: 查询当前用户的健康目标列表，结果只包含当前用户自己的目标。
      operationId: listHealthGoals
      responses:
        '200': { $ref: '#/components/responses/HealthGoalListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [健康目标]
      summary: 新增健康目标
      description: 为当前用户新增健康目标；目标类型、状态和日期组合必须满足业务约束。
      operationId: createHealthGoal
      requestBody: { $ref: '#/components/requestBodies/HealthGoal' }
      responses:
        '200': { $ref: '#/components/responses/HealthGoalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/health-goals/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    patch:
      tags: [健康目标]
      summary: 修改健康目标
      description: targetDate 不能早于 startedOn。
      operationId: updateHealthGoal
      requestBody: { $ref: '#/components/requestBodies/HealthGoal' }
      responses:
        '200': { $ref: '#/components/responses/HealthGoalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [健康目标]
      summary: 删除健康目标
      description: 删除当前用户指定的健康目标；不存在或不属于当前用户时返回 404。
      operationId: deleteHealthGoal
      responses:
        '200': { $ref: '#/components/responses/EmptyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/allergies:
    get:
      tags: [过敏记录]
      summary: 查询过敏记录
      description: 查询当前用户的过敏原记录，结果只包含当前用户自己的记录。
      operationId: listAllergies
      responses:
        '200': { $ref: '#/components/responses/AllergyListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [过敏记录]
      summary: 新增过敏记录
      description: 为当前用户新增过敏原记录；过敏名称不能为空，严重程度使用约定枚举值。
      operationId: createAllergy
      requestBody: { $ref: '#/components/requestBodies/Allergy' }
      responses:
        '200': { $ref: '#/components/responses/AllergyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/allergies/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    patch:
      tags: [过敏记录]
      summary: 修改过敏记录
      description: 修改当前用户指定的过敏原记录；不存在或不属于当前用户时返回 404。
      operationId: updateAllergy
      requestBody: { $ref: '#/components/requestBodies/Allergy' }
      responses:
        '200': { $ref: '#/components/responses/AllergyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [过敏记录]
      summary: 删除过敏记录
      description: 删除当前用户指定的过敏原记录；不存在或不属于当前用户时返回 404。
      operationId: deleteAllergy
      responses:
        '200': { $ref: '#/components/responses/EmptyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/medical-conditions:
    get:
      tags: [疾病记录]
      summary: 查询疾病记录
      description: 查询当前用户的医疗状况记录，结果只包含当前用户自己的记录。
      operationId: listMedicalConditions
      responses:
        '200': { $ref: '#/components/responses/MedicalConditionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [疾病记录]
      summary: 新增疾病记录
      description: 为当前用户新增医疗状况记录；诊断日期和状态必须符合业务约束。
      operationId: createMedicalCondition
      requestBody: { $ref: '#/components/requestBodies/MedicalCondition' }
      responses:
        '200': { $ref: '#/components/responses/MedicalConditionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/medical-conditions/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    patch:
      tags: [疾病记录]
      summary: 修改疾病记录
      description: resolvedOn 不能早于 diagnosedOn。
      operationId: updateMedicalCondition
      requestBody: { $ref: '#/components/requestBodies/MedicalCondition' }
      responses:
        '200': { $ref: '#/components/responses/MedicalConditionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [疾病记录]
      summary: 删除疾病记录
      description: 删除当前用户指定的疾病记录；不存在或不属于当前用户时返回 404。
      operationId: deleteMedicalCondition
      responses:
        '200': { $ref: '#/components/responses/EmptyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/dietary-restrictions:
    get:
      tags: [饮食限制]
      summary: 查询饮食限制
      description: 查询当前用户的饮食限制记录，结果只包含当前用户自己的记录。
      operationId: listDietaryRestrictions
      responses:
        '200': { $ref: '#/components/responses/DietaryRestrictionListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [饮食限制]
      summary: 新增饮食限制
      description: 为当前用户新增饮食限制记录；限制类别和日期范围必须符合业务约束。
      operationId: createDietaryRestriction
      requestBody: { $ref: '#/components/requestBodies/DietaryRestriction' }
      responses:
        '200': { $ref: '#/components/responses/DietaryRestrictionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/dietary-restrictions/{id}:
    parameters: [{ $ref: '#/components/parameters/RecordId' }]
    patch:
      tags: [饮食限制]
      summary: 修改饮食限制
      description: endsOn 不能早于 startsOn。
      operationId: updateDietaryRestriction
      requestBody: { $ref: '#/components/requestBodies/DietaryRestriction' }
      responses:
        '200': { $ref: '#/components/responses/DietaryRestrictionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [饮食限制]
      summary: 删除饮食限制
      description: 删除当前用户指定的饮食限制记录；不存在或不属于当前用户时返回 404。
      operationId: deleteDietaryRestriction
      responses:
        '200': { $ref: '#/components/responses/EmptyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/cuisine-preferences:
    get:
      tags: [菜系偏好]
      summary: 查询菜系偏好
      description: 查询当前用户的菜系偏好列表，结果只包含当前用户自己的偏好。
      operationId: listCuisinePreferences
      responses:
        '200': { $ref: '#/components/responses/CuisinePreferenceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [菜系偏好]
      summary: 全量替换菜系偏好
      description: 用完整列表替换当前用户所有菜系偏好；cuisineCode 忽略大小写后不能重复。
      operationId: replaceCuisinePreferences
      requestBody: { $ref: '#/components/requestBodies/CuisinePreferences' }
      responses:
        '200': { $ref: '#/components/responses/CuisinePreferenceListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/clinical-observations:
    get:
      tags: [临床观察]
      summary: 查询临床观察
      description: 查询当前用户的临床观察历史；临床观察只允许追加，不能修改或删除。
      operationId: listClinicalObservations
      responses:
        '200': { $ref: '#/components/responses/ClinicalObservationListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [临床观察]
      summary: 追加临床观察
      description: valueNumeric 与 valueText 必须且只能提供一个；metadata 必须是 JSON 对象字符串；记录创建后不可修改或删除。
      operationId: createClinicalObservation
      requestBody: { $ref: '#/components/requestBodies/ClinicalObservation' }
      responses:
        '200': { $ref: '#/components/responses/ClinicalObservationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/users/self/consents:
    get:
      tags: [同意记录]
      summary: 查询同意记录
      description: 查询当前用户的同意记录历史；同意记录只允许追加，不能修改或删除。
      operationId: listUserConsents
      responses:
        '200': { $ref: '#/components/responses/ConsentListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [同意记录]
      summary: 追加同意记录
      description: source 默认为 mobile；服务端记录客户端 IP 和 User-Agent；记录创建后不可修改或删除。
      operationId: createUserConsent
      requestBody: { $ref: '#/components/requestBodies/Consent' }
      responses:
        '200': { $ref: '#/components/responses/ConsentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/files/avatar/presign:
    post:
      tags: [头像]
      summary: 获取头像上传预签名 URL
      description: 只生成临时对象键和 PUT URL；RN 应直接向对象存储上传，不经过 Orion。支持 image/jpeg、image/png、image/webp、image/gif。
      operationId: presignAvatarUpload
      requestBody: { $ref: '#/components/requestBodies/AvatarPresign' }
      responses:
        '200': { $ref: '#/components/responses/PresignedUrlResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/files/avatar/confirm:
    post:
      tags: [头像]
      summary: 确认头像上传
      description: 请求体必须是 objectKey 本身的 JSON 字符串，且必须属于当前用户的 avatar-staging/{userId}/ 命名空间；确认后转为正式 avatars/{userId}/ 对象。
      operationId: confirmAvatarUpload
      requestBody: { $ref: '#/components/requestBodies/AvatarConfirm' }
      responses:
        '200': { $ref: '#/components/responses/AvatarConfirmResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/files/avatar:
    get:
      tags: [头像]
      summary: 获取当前用户头像访问 URL
      description: 返回短期有效的预签名 GET URL；未设置头像时返回 404。
      operationId: getAvatarUrl
      responses:
        '200': { $ref: '#/components/responses/AvatarUrlResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Authentik OIDC access_token。客户端不要伪造 X-Auth-* 或 X-Gateway-Source 请求头。
  parameters:
    RecordId:
      name: id
      in: path
      required: true
      description: 业务记录雪花 ID，64 位整数；只允许访问当前用户自己的记录。
      schema: { type: integer, format: int64, minimum: 1 }
  requestBodies:
    ProfileUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UserProfileUpdateRequest' }
    BodyMeasurement:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BodyMeasurementRequest' }
    HealthGoal:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/HealthGoalRequest' }
    Allergy:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AllergyRequest' }
    MedicalCondition:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MedicalConditionRequest' }
    DietaryRestriction:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DietaryRestrictionRequest' }
    CuisinePreferences:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReplaceCuisinePreferencesRequest' }
    ClinicalObservation:
      required: true
