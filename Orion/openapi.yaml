        notes: { type: string, nullable: true, description: 备注 }
        createdAt: { type: string, format: date-time, description: 创建时间 }
        updatedAt: { type: string, format: date-time, description: 更新时间 }
    UserHealthGoal:
      type: object
      required: [goalId, userId, goalType, priority, status, startedOn, createdAt, updatedAt]
      properties:
        goalId: { type: integer, format: int64, minimum: 1, description: 雪花目标 ID }
