        targetDate: { type: string, format: date, nullable: true, description: 目标日期 }
        completedAt: { type: string, format: date-time, nullable: true, description: 完成时间 }
        notes: { type: string, nullable: true, description: 备注 }
        createdAt: { type: string, format: date-time, description: 创建时间 }
        updatedAt: { type: string, format: date-time, description: 更新时间 }
    UserAllergy:
      type: object
