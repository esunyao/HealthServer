server:
  port: ${SERVER_PORT:8099}

spring:
  output:
    ansi:
      enabled: always
  application:
    name: NutriMemo

  config:
    import:
      - "nacos:NutriMemo_Application.yaml?group=${NACOS_GROUP:NUTRIMEMO_GROUP}&refreshEnabled=true"

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 3
      connection-timeout: 20000

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${NUTRIMEMO_KAFKA_CONSUMER_GROUP:nutrimemo-analysis-result-v1}
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
      ssl.keystore.location: ${KAFKA_SSL_KEYSTORE_LOCATION:}
      ssl.keystore.password: ${KAFKA_SSL_KEYSTORE_PASSWORD:}
      ssl.key.password: ${KAFKA_SSL_KEY_PASSWORD:}

  cloud:
    nacos:
      serverAddr: ${NACOS_SERVER_ADDR:}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        enabled: true
        group: ${NACOS_GROUP:HEALTH_GROUP}

nutri:
  capture:
    session-ttl: 24h
    cleanup-interval: 15m
    max-draft-sessions: 5
  oss:
    endpoint: ${NUTRI_OSS_ENDPOINT:}
    presigned-addr: ${NUTRI_OSS_ADDR:}
    access-key: ${NUTRI_OSS_ACCESS_KEY:}
    secret-key: ${NUTRI_OSS_SECRET_KEY:}
    bucket: ${NUTRI_OSS_BUCKET:}
    region: ${NUTRI_OSS_REGION:us-east-1}
    presigned-expiration: 5m
    max-file-size: 10485760
    allowed-content-types: [image/jpeg, image/png, image/webp]
  integration:
    capture-ready-destination: ${NUTRIMEMO_CAPTURE_READY_DESTINATION:nutrition-capture-ready}
    analysis-completed-destination: ${NUTRIMEMO_ANALYSIS_COMPLETED_DESTINATION:nutrition-analysis-completed}
    analysis-failed-destination: ${NUTRIMEMO_ANALYSIS_FAILED_DESTINATION:nutrition-analysis-failed}
    consumer-group: ${NUTRIMEMO_KAFKA_CONSUMER_GROUP:nutrimemo-analysis-result-v1}
    outbox-fixed-delay: ${NUTRIMEMO_OUTBOX_FIXED_DELAY:1s}
    recovery-fixed-delay: ${NUTRIMEMO_RECOVERY_FIXED_DELAY:1m}
    publish-timeout: ${NUTRIMEMO_PUBLISH_TIMEOUT:15s}
  internal:
    security:
      issuer-uri: ${NUTRIMEMO_INTERNAL_ISSUER_URI:http://localhost:9000/application/o/nutrimemo-internal/}
      jwk-set-uri: ${NUTRIMEMO_INTERNAL_JWK_SET_URI:http://localhost:9000/application/o/nutrimemo-internal/jwks/}
      audience: ${NUTRIMEMO_INTERNAL_AUDIENCE:nutrimemo-internal}
      allowed-health-mind-client-id: ${NUTRIMEMO_HEALTHMIND_CLIENT_ID:healthmind-nutrimemo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    cn.esuny.nutrimemo: INFO
