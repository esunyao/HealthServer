openapi: 3.1.0
info:
  title: NutriMemo 拍照饮食服务 API
  version: 2.0.0
  description: |
    客户端经 Gateway 创建个人拍照采集会话、上传并确认 1–10 张图片后显式提交识别。
    本版本不提供食物库、手动建餐、DietAi、Kafka 或 AI 原始结果接口。
servers:
  - url: http://localhost:8091
    description: Gateway
security: [{ bearerAuth: [] }]
tags:
  - name: 拍照采集
  - name: 餐次历史
  - name: 营养汇总
paths:
  /v1/nutri/capture-policy:
    get:
      tags: [拍照采集]
      summary: 获取图片采集限制
      operationId: getCapturePolicy
      responses: { '200': { $ref: '#/components/responses/CapturePolicy' } }
  /v1/nutri/capture-sessions:
    post:
      tags: [拍照采集]
      summary: 创建或幂等返回拍照采集会话
      operationId: createCaptureSession
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaptureSessionCreateRequest' } } } }
      responses:
        '201': { $ref: '#/components/responses/CaptureSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/nutri/capture-sessions/drafts:
    get:
      tags: [拍照采集]
      summary: 获取当前用户未提交的拍照草稿
      operationId: listCaptureDrafts
      responses: { '200': { $ref: '#/components/responses/CaptureDraftPage' } }
  /v1/nutri/capture-sessions/{sessionId}:
    parameters: [{ $ref: '#/components/parameters/CaptureSessionId' }]
    get:
      tags: [拍照采集]
      summary: 查询识别会话及图片状态
      operationId: getCaptureSession
      responses: { '200': { $ref: '#/components/responses/CaptureSession' }, '404': { $ref: '#/components/responses/NotFound' } }
    delete:
      tags: [拍照采集]
      summary: 取消尚未提交识别的会话
      operationId: cancelCaptureSession
      responses: { '200': { $ref: '#/components/responses/Empty' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/nutri/capture-sessions/{sessionId}/images/presign:
    post:
      tags: [拍照采集]
      summary: 服务端分配槽位并获取直传 URL
      operationId: presignCaptureImage
      parameters: [{ $ref: '#/components/parameters/CaptureSessionId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaptureImagePresignRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/PresignedUrl' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/nutri/capture-sessions/{sessionId}/images/{imageId}/confirm:
    post:
      tags: [拍照采集]
      summary: 验证 OSS 对象后确认图片
      operationId: confirmCaptureImage
      parameters: [{ $ref: '#/components/parameters/CaptureSessionId' }, { $ref: '#/components/parameters/ImageId' }]
      responses: { '200': { $ref: '#/components/responses/CaptureImage' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/nutri/capture-sessions/{sessionId}/images/{imageId}:
    delete:
      tags: [拍照采集]
      summary: 删除尚未提交识别的图片
      operationId: deleteCaptureImage
      parameters: [{ $ref: '#/components/parameters/CaptureSessionId' }, { $ref: '#/components/parameters/ImageId' }]
      responses: { '200': { $ref: '#/components/responses/Empty' } }
  /v1/nutri/capture-sessions/{sessionId}/submit:
    post:
      tags: [拍照采集]
      summary: 将至少一张已确认图片先入库为餐食并提交待识别事件
      operationId: submitCaptureSession
      parameters: [{ $ref: '#/components/parameters/CaptureSessionId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaptureSubmitRequest' } } } }
      responses: { '202': { $ref: '#/components/responses/CaptureSubmission' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/nutri/capture-sessions/{sessionId}/retry:
    post:
      tags: [拍照采集]
      summary: 复用失败会话的已确认图片重新排队
      operationId: retryCaptureSession
      parameters: [{ $ref: '#/components/parameters/CaptureSessionId' }]
      responses: { '202': { $ref: '#/components/responses/CaptureSubmission' }, '409': { $ref: '#/components/responses/Conflict' } }
  /v1/nutri/meals:
    get:
      tags: [餐次历史]
      summary: 按日期、餐次和菜品/备注关键词分页查询历史
      operationId: listMeals
      parameters: [{ $ref: '#/components/parameters/DateFrom' }, { $ref: '#/components/parameters/DateTo' }, { $ref: '#/components/parameters/MealType' }, { $ref: '#/components/parameters/Keyword' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { $ref: '#/components/responses/MealPage' } }
  /v1/nutri/meals/{mealId}:
    parameters: [{ $ref: '#/components/parameters/MealId' }]
    get:
      tags: [餐次历史]
      summary: 获取单餐完整营养报告
      operationId: getMeal
      responses: { '200': { $ref: '#/components/responses/Meal' }, '404': { $ref: '#/components/responses/NotFound' } }
    patch:
      tags: [餐次历史]
      summary: 修改餐次元数据而不覆盖 AI 餐食项
      operationId: patchMeal
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MealMetadataPatchRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Meal' }, '400': { $ref: '#/components/responses/BadRequest' } }
    put:
      tags: [餐次历史]
      summary: 整餐替换人工修正并重算汇总
      operationId: replaceMeal
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MealCorrectionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/Meal' }, '400': { $ref: '#/components/responses/BadRequest' } }
    delete:
      tags: [餐次历史]
      summary: 软删除餐次并重算每日汇总
      operationId: deleteMeal
      responses: { '200': { $ref: '#/components/responses/Empty' } }
  /v1/nutri/summaries/daily:
    get:
      tags: [营养汇总]
      summary: 获取本地日期营养汇总
      operationId: getDailySummary
      parameters: [{ $ref: '#/components/parameters/LocalDate' }]
      responses: { '200': { $ref: '#/components/responses/DailySummary' } }
  /v1/nutri/summaries/daily-trend:
    get:
      tags: [营养汇总]
      summary: 获取每日营养趋势
      operationId: getDailyTrend
      parameters: [{ $ref: '#/components/parameters/DateFrom' }, { $ref: '#/components/parameters/DateTo' }]
      responses: { '200': { $ref: '#/components/responses/DailyTrend' } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters:
    CaptureSessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    ImageId: { name: imageId, in: path, required: true, schema: { type: string, description: 雪花 ID，以字符串传输避免 JavaScript 精度丢失 } }
    MealId: { name: mealId, in: path, required: true, schema: { type: string, description: 雪花 ID，以字符串传输避免 JavaScript 精度丢失 } }
    IdempotencyKey: { name: X-Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    DateFrom: { name: dateFrom, in: query, required: true, schema: { type: string, format: date } }
    DateTo: { name: dateTo, in: query, required: true, schema: { type: string, format: date } }
    LocalDate: { name: localDate, in: query, required: true, schema: { type: string, format: date } }
    MealType: { name: mealType, in: query, required: false, schema: { $ref: '#/components/schemas/MealType' } }
    Keyword: { name: q, in: query, required: false, schema: { type: string, maxLength: 100 } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  schemas:
    MealType: { type: string, enum: [breakfast, lunch, dinner, snack, other] }
    CaptureSessionCreateRequest: { type: object, required: [timezone], properties: { timezone: { type: string, example: Asia/Shanghai } } }
    CaptureSubmitRequest: { type: object, required: [mealType], properties: { mealType: { $ref: '#/components/schemas/MealType' }, notes: { type: [string, 'null'], maxLength: 1000 } } }
    CapturePolicyView:
      type: object
      required: [maxImageCount, maxFileSizeBytes, allowedContentTypes, sessionExpiresInSeconds, maxDraftSessionCount, draftExpiresInSeconds]
      properties:
        maxImageCount: { type: integer, minimum: 1, maximum: 10 }
        maxFileSizeBytes: { type: integer }
        allowedContentTypes: { type: array, items: { type: string } }
        sessionExpiresInSeconds: { type: integer }
        maxDraftSessionCount: { type: integer, minimum: 1 }
        draftExpiresInSeconds: { type: integer }
    CaptureImage:
      type: object
      required: [imageId, slotNo, objectKey, contentType, contentLength, status, createdAt]
      properties:
        imageId: { type: string, description: 图片雪花 ID，以字符串传输 }
        slotNo: { type: integer }
        objectKey: { type: string }
        contentType: { type: string }
        contentLength: { type: integer }
        capturedAt: { type: [string, 'null'], format: date-time }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        previewUrl: { type: [string, 'null'], format: uri, description: 仅当前用户可访问的短期预览地址 }
        previewExpiresInSeconds: { type: [integer, 'null'] }
    CaptureDraftSummary:
      type: object
      required: [captureSessionId, status, confirmedImageCount, maxImageCount, expiresAt, createdAt, updatedAt, images]
      properties:
        captureSessionId: { type: string, format: uuid }
        status: { type: string, enum: [created, uploading] }
        confirmedImageCount: { type: integer, minimum: 0 }
        maxImageCount: { type: integer }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        images: { type: array, items: { $ref: '#/components/schemas/CaptureImage' } }
    CaptureDraftPage:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CaptureDraftSummary' } }
        total: { type: integer }
    CaptureImagePresignRequest: { type: object, required: [fileName, contentType, contentLength], properties: { fileName: { type: string }, contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }, contentLength: { type: integer, maximum: 10485760 }, capturedAt: { type: [string, 'null'], format: date-time } } }
    NutrientInput: { type: object, required: [nutrientCode, amount], properties: { nutrientCode: { type: string }, amount: { type: number, minimum: 0 } } }
    MealCorrectionItem: { type: object, required: [displayName, nutrients], properties: { itemId: { type: [string, 'null'], description: 雪花 ID，以字符串传输避免 JavaScript 精度丢失 }, displayName: { type: string }, estimatedWeightG: { type: [number, 'null'] }, notes: { type: [string, 'null'] }, nutrients: { type: array, items: { $ref: '#/components/schemas/NutrientInput' } } } }
    MealMetadataPatchRequest: { type: object, properties: { mealType: { $ref: '#/components/schemas/MealType' }, consumedAt: { type: string, format: date-time }, timezone: { type: string }, notes: { type: [string, 'null'] } } }
    MealCorrectionRequest: { type: object, required: [mealType, consumedAt, timezone], properties: { mealType: { $ref: '#/components/schemas/MealType' }, consumedAt: { type: string, format: date-time }, timezone: { type: string }, notes: { type: [string, 'null'] }, items: { type: array, items: { $ref: '#/components/schemas/MealCorrectionItem' } } } }
    PresignedUrl:
      type: object
      required: [imageId, uploadUrl, objectKey, expiresInSeconds, requiredHeaders]
      properties:
        imageId: { type: string, description: 图片雪花 ID；客户端必须按字符串保存并用于确认路径 }
        uploadUrl: { type: string, format: uri }
        objectKey: { type: string }
        expiresInSeconds: { type: integer }
        requiredHeaders: { type: object, additionalProperties: { type: string } }
    ApiResponse: { type: object, required: [code, message, traceId], properties: { code: { type: integer }, message: { type: string }, traceId: { type: string }, data: {} } }
  responses:
    CapturePolicy: { description: 成功, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiResponse' }, { type: object, properties: { data: { $ref: '#/components/schemas/CapturePolicyView' } } }] } } } }
    CaptureSession: { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
    CaptureDraftPage: { description: 成功, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiResponse' }, { type: object, properties: { data: { $ref: '#/components/schemas/CaptureDraftPage' } } }] } } } }
    CaptureSubmission: { description: 餐食已入库并排队, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
    CaptureImage: { description: 成功, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiResponse' }, { type: object, properties: { data: { $ref: '#/components/schemas/CaptureImage' } } }] } } } }
    PresignedUrl: { description: 成功, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiResponse' }, { type: object, properties: { data: { $ref: '#/components/schemas/PresignedUrl' } } }] } } } }
    Meal: { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
    MealPage: { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
    DailySummary: { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
    DailyTrend: { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
    Empty: { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
    BadRequest: { description: 请求非法, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
    Unauthorized: { description: 未授权, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
    NotFound: { description: 不存在或不属于当前用户, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
    Conflict: { description: 当前状态不允许该操作, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } } }
