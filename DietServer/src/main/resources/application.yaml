server:
  port: 8082
  address: 10.199.163.143

spring:
  application:
    name: DietServer

  # Spring Boot 配置导入机制，指定从 Nacos 加载配置
  config:
    import:
      - nacos:DietServer_Application.yaml?group=DIET_GROUP&refreshEnabled=true

  # ----------------------------------------------------------
  # 数据源配置 — PostgreSQL
  # ----------------------------------------------------------
  datasource:
    url: jdbc:postgresql://192.168.3.101:5432/Health?currentSchema=Diet&stringtype=unspecified
    username: svc_user
    password: svc_user
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20      # 连接池最大连接数
      minimum-idle: 5            # 最小空闲连接数
      idle-timeout: 300000       # 空闲连接超时时间（5分钟）
      max-lifetime: 1200000      # 连接最大存活时间（20分钟）
      connection-timeout: 20000  # 获取连接超时时间（20秒）

  # ----------------------------------------------------------
  # Redis 配置
  # ----------------------------------------------------------
  data:
    redis:
      host: 192.168.3.101
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

  # ----------------------------------------------------------
  # Nacos 服务发现配置（Spring Cloud Alibaba 原生）
  # ----------------------------------------------------------
  cloud:
    nacos:
      serverAddr: 192.168.3.101:8848
      username: 'diet'
      password: 'diet'
      discovery:
        enabled: true
        group: 'HEALTH_GROUP'
        ip: 10.199.163.143

# ----------------------------------------------------------
# Actuator 监控端点配置
# ----------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ----------------------------------------------------------
# 日志配置
# ----------------------------------------------------------
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-NO_TRACE}] %-5level %logger{36} - %msg%n"
  level:
    cn.esuny.dietserver: DEBUG
    cn.esuny.dietserver.mapper: DEBUG
